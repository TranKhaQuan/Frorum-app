version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: forum_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: forum_db
      MYSQL_USER: forum_user
      MYSQL_PASSWORD: forum_password
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: forum_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8081:80"

  app:
    build: ./app
    container_name: forum_app
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./app:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db

  prometheus:
    image: prom/prometheus:latest
    container_name: forum_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:2.9.0
    container_name: forum_loki
    restart: always
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:2.9.0
    container_name: forum_promtail
    restart: always
    user: root
    volumes:
      - /var/log:/var/log
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: forum_grafana
    restart: always
    ports:
      - "30000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  db_data:
